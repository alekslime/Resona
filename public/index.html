<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touch Atlas</title>
  <meta name="description" content="Explore a picture by touch. Drag a finger over it to hear and feel its parts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Touch Atlas</h1>
    <label class="speed">Speech speed
      <input id="rate" type="range" min="0.7" max="1.8" step="0.1" value="1.1">
    </label>
  </header>

  <main>
    <section id="start" class="panel">
      <p class="lead">Feel a picture with your finger.</p>
      <p class="sub">Choose a diagram, chart or photo. Drag across it and each part speaks its name and buzzes under your fingertip.</p>
      <div class="actions">
        <label class="btn primary" for="file">Choose a picture
          <input id="file" type="file" accept="image/*" hidden>
        </label>
        <button class="btn" id="sample" type="button">Try the sample picture</button>
      </div>
      <p id="startNote" class="note" role="status"></p>
    </section>

    <section id="busy" class="panel" hidden>
      <p class="lead" id="busyText">Reading the picture.</p>
      <p class="sub">Finding its parts and drawing their outlines. This takes about half a minute.</p>
    </section>

    <section id="explore" hidden>
      <div class="stage" id="stage">
        <canvas id="canvas" aria-label="Picture. Drag a finger across it to hear its parts."></canvas>
      </div>
      <p id="caption" class="caption"></p>
      <nav class="bar" aria-label="Picture controls">
        <button class="btn" id="overview" type="button">Overview</button>
        <button class="btn" id="partsBtn" type="button">List parts</button>
        <button class="btn" id="askBtn" type="button">Ask</button>
        <button class="btn" id="again" type="button">New picture</button>
      </nav>
      <details class="parts">
        <summary>Parts as a list</summary>
        <ul id="partsList"></ul>
      </details>
    </section>
  </main>

  <dialog id="askDialog">
    <form method="dialog" id="askForm">
      <label for="question">Your question about this picture</label>
      <input id="question" type="text" autocomplete="off">
      <div class="actions">
        <button class="btn primary" id="askSend" value="send" type="submit">Ask</button>
        <button class="btn" id="mic" type="button" hidden>Speak it</button>
        <button class="btn" value="cancel" type="button" id="askCancel">Close</button>
      </div>
      <p id="answer" class="answer" role="status"></p>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
