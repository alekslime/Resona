# Render blueprint: public API in one click (Dashboard → New → Blueprint).
# Add MODEL_API_KEY as a secret env var after the first deploy.
# Free instances sleep when idle: the first request wakes them (~30 s), and the
# app's bundled samples work even while it wakes.
services:
  - type: web
    name: resonant-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODEL_API_KEY
        sync: false
      - key: SPARK_MODEL
        value: muse-spark-1.3
      - key: SPARK_REASONING_EFFORT
        value: low
      # Behind the proxy the client IP arrives in X-Forwarded-For;
      # without this every visitor shares one rate-limit bucket.
      - key: TRUST_PROXY
        value: 1
